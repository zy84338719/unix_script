name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

# 同一分支的新推送取消正在运行的旧运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # Job 1: 静态检查（bash -n + shellcheck），Linux + macOS
  # ============================================================
  static:
    name: 静态检查 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 shellcheck
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi

      - name: 运行静态检查并生成报告
        shell: bash
        run: |
          chmod +x tests/ci_run.sh
          ./tests/ci_run.sh --phase static --out static-report.md

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-report-${{ matrix.os }}
          path: static-report.md
          if-no-files-found: error

  # ============================================================
  # Job 2: 路由与子命令测试，Linux + macOS
  # ============================================================
  routing:
    name: 路由测试 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 运行路由测试并生成报告
        shell: bash
        run: |
          chmod +x tests/ci_run.sh
          ./tests/ci_run.sh --phase routing --out routing-report.md

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-report-${{ matrix.os }}
          path: routing-report.md
          if-no-files-found: error

  # ============================================================
  # Job 2b: 容器静态检查 —— 多 Linux 发行版（补充 VM 矩阵未覆盖的 shellcheck 版本）
  #
  # 设计说明：
  #   - GitHub Actions 无原生 CentOS/RHEL runner，只能在 ubuntu runner 里用 container: 跑。
  #   - 不同发行版的 shellcheck 版本不同（debian12≈0.9.0、ubuntu≈0.8.0、macOS≈0.11.0、
  #     CentOS EPEL≈0.10.0），版本差异会导致规则不一致（曾因 0.8.0 报 SC2002/SC2086
  #     而 0.11.0 不报）。本 job 在各包系族容器内复用同一 tests/ci_run.sh --phase static。
  # ============================================================
  static-container:
    name: 容器静态检查 / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-12
            image: debian:12
          - distro: centos-stream9
            image: quay.io/centos/centos:stream9
          - distro: almalinux-9
            image: almalinux:9
    steps:
      - uses: actions/checkout@v4

      - name: 安装 shellcheck 与 bash（按发行版包管理器）
        shell: sh
        run: |
          # RHEL 系：shellcheck 在 EPEL 仓库，先装 epel-release；Debian 系：apt 直装
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y -q epel-release
            dnf install -y -q shellcheck bash
          elif command -v yum >/dev/null 2>&1; then
            yum install -y -q epel-release
            yum install -y -q shellcheck bash
          elif command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            apt-get install -y -q shellcheck bash
          fi

      - name: 运行静态检查并生成报告
        shell: bash
        run: |
          chmod +x tests/ci_run.sh
          ./tests/ci_run.sh --phase static --out static-report.md

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-report-container-${{ matrix.distro }}
          path: static-report.md
          if-no-files-found: error

  # ============================================================
  # Job 3: 实装测试 —— 多 Linux 发行版
  #
  # 设计说明（CI 可行性约束）：
  #   - GitHub Actions 的 container: 不支持 privileged，systemd 无法作为 PID 1 启动。
  #     故容器矩阵只验证「包名解析 / 脚本可解析目标发行版」这类不依赖 systemd 的环节。
  #   - 完整 systemd 实装（fail2ban / node_exporter 启停验证）放在 ubuntu-latest VM 上
  #     （真实 VM，systemd 原生可用）。
  #   - macOS 实装仅进程管理工具（纯用户态）；Docker-on-mac 因无嵌套虚拟化不可行，故跳过。
  # ============================================================
  install-container:
    name: 包解析 / 容器 / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 说明：opensuse/leap 精简镜像缺 tar，actions/checkout 解包需要它，
          # 故在最前面按包系预装（先于 checkout 执行）
          # Debian 系 —— 主流多版本
          # expect_id/expect_family: 该发行版的外部真值，注入给 ci_run.sh 的
          # 「发行版识别」断言（UXS_EXPECT_DISTRO_*），防止检测逻辑自我循环论证
          - distro: ubuntu-26.04          # 当前 LTS（20.04/22.04 已移出矩阵）
            image: ubuntu:26.04
            expect_id: ubuntu
            expect_family: debian
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            expect_id: ubuntu
            expect_family: debian
          - distro: debian-12
            image: debian:12
            expect_id: debian
            expect_family: debian
          - distro: debian-13
            image: debian:13
            expect_id: debian
            expect_family: debian
          # RHEL 系
          - distro: fedora
            image: fedora:latest
            expect_id: fedora
            expect_family: rhel
          - distro: centos-stream9
            image: quay.io/centos/centos:stream9
            expect_id: centos
            expect_family: rhel
          - distro: almalinux-9
            image: almalinux:9
            expect_id: almalinux
            expect_family: rhel
          - distro: rocky-9
            image: rockylinux:9
            expect_family: rhel
          # 独立发行版
          - distro: opensuse-leap         # Leap 15.6（Tumbleweed 滚动版上游源持续超时，换稳定版）
            image: opensuse/leap:15.6
            expect_id: opensuse-leap
            expect_family: suse
          - distro: arch
            image: archlinux:latest
            expect_id: arch
            expect_family: arch
          - distro: alpine
            image: alpine:latest
            expect_id: alpine
            expect_family: alpine
    steps:
      - name: Pre-checkout 预装解包依赖（leap 精简镜像缺 tar）
        shell: sh
        run: |
          if command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive install tar gzip >/dev/null 2>&1 || true
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache tar >/dev/null 2>&1 || true
          fi
      - uses: actions/checkout@v4

      - name: 安装基础依赖（容器极简镜像需要）
        # 用 sh 而非 bash：Alpine 默认无 bash，需先用 sh 装上 bash
        shell: sh
        run: |
          # 各包管理器族安装 bash/sudo/curl（which 在 debian 系由 debianutils 内置）
          if command -v apt-get >/dev/null 2>&1; then
            # noninteractive：tzdata 等包在无 TTY 容器里会弹 debconf 交互挂死
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y bash sudo curl
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y --allowerasing bash sudo curl which
          elif command -v yum >/dev/null 2>&1; then
            yum install -y bash sudo curl which
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive refresh
            # findutils：最小化容器镜像缺 find（disk-usage top 文件榜依赖）
            zypper --non-interactive install bash sudo curl which gawk findutils
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm --needed bash sudo curl which
          elif command -v apk >/dev/null 2>&1; then
            # findutils：GNU find 取代 busybox find（busybox 的 -size 不认 M/G 后缀）
            apk add --no-cache bash sudo curl which findutils
          fi

      - name: 验证包管理器识别与脚本可解析
        shell: bash
        env:
          # 发行版外部真值断言（见矩阵 expect_id/expect_family 注释）
          UXS_EXPECT_DISTRO_ID: ${{ matrix.expect_id }}
          UXS_EXPECT_DISTRO_FAMILY: ${{ matrix.expect_family }}
        run: |
          chmod +x tests/ci_run.sh
          # 容器内做路由级验证（验证各发行版 detect_pkg_manager 与脚本可解析）
          ./tests/ci_run.sh --phase routing --out routing-report.md

      # 所有容器额外做 essential-pkgs 实装，验证各发行版包安装分支真实可用。
      - name: 各发行版 essential-pkgs 实装测试
        shell: bash
        run: |
          echo ">>> 运行 essential-pkgs 实装测试（验证当前发行版的包安装分支）"
          ./tests/ci_run.sh --phase install --module essential-pkgs --out install-report.md

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-container-${{ matrix.distro }}
          path: |
            routing-report.md
            install-report.md
          if-no-files-found: warn

  # ============================================================
  # Job 3b: 国产化平台验证 —— 麒麟 / 统信 UOS / openEuler + 遗留 CentOS 7
  #
  # 设计说明：
  #   - 麒麟/统信无公开的官方容器镜像，采用社区维护镜像（macrosan/*，基于官方
  #     软件源构建）；openEuler 用官方镜像（麒麟服务器版的上游发行版）。
  #   - 验证内容：detect_distro 发行版识别（注入外部真值断言）+ 路由测试 +
  #     essential-pkgs 实装（RPM 系 yum/dnf 分支真实走包安装）。
  #   - continue-on-error：社区镜像的可维护性与海外网络访问国产软件源不受我们
  #     控制，结果尽力而为、记入报告但不阻塞质量门禁（与 install-vm 同策略）。
  #   - 不用 actions/checkout：其 node20 运行时要求 glibc≥2.28，CentOS 7 等老
  #     镜像跑不动，改为容器内原生 git fetch 当前 ref。
  # ============================================================
  install-container-domestic:
    name: 国产化平台验证 / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: kylin-v10-sp3          # 银河麒麟高级服务器版 V10 SP3（RPM 系）
            image: docker.io/macrosan/kylin:v10-sp3-2403
            expect_id: kylin
            expect_family: rhel
          - distro: uos-v20                # 统信 UOS 服务器版 V20（RPM 系）
            image: docker.io/macrosan/uos:v20-1070
            expect_id: uos
            expect_family: rhel
          - distro: openeuler-24.03-lts    # openEuler 官方镜像（麒麟服务器版上游）
            image: docker.io/openeuler/openeuler:24.03-lts
            expect_id: openeuler
            expect_family: rhel
          # —— 国产桌面操作系统（Deb 系）——
          - distro: deepin-23              # 深度 deepin 官方镜像（DDE 桌面，Deb 系）
            image: docker.io/linuxdeepin/deepin:latest
            expect_id: deepin
            expect_family: debian
          - distro: openkylin              # 开放麒麟官方镜像（麒麟桌面版同源，Deb 系）
            image: docker.io/openkylin/openkylin:latest
            expect_id: openkylin
            expect_family: debian
          # 麒麟桌面版/统信桌面版无公开容器镜像，其识别由 ci_run.sh 的
          # 「桌面发行版」os-release 仿真夹具断言覆盖（见 routing 阶段 20a-2）。
    steps:
      - name: 安装基础工具（bash/git/curl/sudo）
        shell: sh
        run: |
          # CentOS 7 官方源已下线（mirrorlist 404），先切 vault 才能装东西
          if grep -q "release 7" /etc/centos-release 2>/dev/null; then
            sed -i 's|^mirrorlist|#mirrorlist|g; s|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo
          fi
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y bash git curl sudo which
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y bash git curl sudo which
          elif command -v yum >/dev/null 2>&1; then
            yum install -y bash git curl sudo which
          fi

      - name: Checkout（容器内原生 git fetch，规避 actions/checkout 的 node20/glibc 要求）
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          # GITHUB_REF 覆盖 push（refs/heads/*）与 PR（refs/pull/*/merge）；
          # PR 合并瞬间触发时 merge ref 已被删，回退拉 head 分支 ref
          git fetch -q --depth 1 origin "$GITHUB_REF" || \
            { [ -n "${GITHUB_HEAD_REF:-}" ] && git fetch -q --depth 1 origin "refs/heads/${GITHUB_HEAD_REF}"; }
          git checkout -q FETCH_HEAD

      - name: 运行路由测试（含发行版识别断言）
        shell: bash
        env:
          UXS_EXPECT_DISTRO_ID: ${{ matrix.expect_id }}
          UXS_EXPECT_DISTRO_FAMILY: ${{ matrix.expect_family }}
        run: |
          chmod +x tests/ci_run.sh
          ./tests/ci_run.sh --phase routing --out routing-report.md

      - name: essential-pkgs 实装测试（验证 RPM 系安装分支）
        shell: bash
        run: |
          ./tests/ci_run.sh --phase install --module essential-pkgs --out install-report.md

      - name: 平台识别信息写入步骤摘要
        if: always()
        shell: bash
        run: |
          {
            echo "### 国产化平台验证 / ${{ matrix.distro }}"
            echo
            echo '```'
            grep -E '^(ID|VERSION_ID|PRETTY_NAME|ID_LIKE)=' /etc/os-release 2>/dev/null || echo "(无 /etc/os-release)"
            echo '```'
            echo
            source ./lib/common.sh && detect_distro
            echo "detect_distro → ID=${DISTRO_ID:-(空)} 版本=${DISTRO_VERSION_ID:-(空)} 族=${DISTRO_FAMILY}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        # upload-artifact 的 node 跑不动 glibc<2.28 的容器（centos:7）：
        # 验证步骤本身已全过，报告上传失败仅降级提示，不让腿变红
        continue-on-error: true
        with:
          name: domestic-${{ matrix.distro }}
          path: |
            routing-report.md
            install-report.md
          if-no-files-found: warn

  install-vm:
    name: 实装测试 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            modules: fail2ban,node_exporter,pm
          - os: macos-latest
            modules: pm
    steps:
      - uses: actions/checkout@v4

      - name: 运行实装测试
        shell: bash
        env:
          # 注入 GITHUB_TOKEN 以提升 api.github.com 速率限制到 5000/h，
          # 规避 node_exporter 等获取最新版本时的 403。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x tests/ci_run.sh
          ./tests/ci_run.sh --phase install --module ${{ matrix.modules }} --out install-report.md

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-vm-${{ matrix.os }}
          path: install-report.md
          if-no-files-found: error

  # ============================================================
  # Job 4: 汇总报告 —— 聚合所有矩阵腿的报告为单一 ci-report.md
  # ============================================================
  report:
    name: 汇总报告
    runs-on: ubuntu-latest
    needs: [static, static-container, routing, install-container, install-container-domestic, install-vm]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有报告产物
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: 合并为 ci-report.md
        shell: bash
        run: |
          set -e
          {
            echo "# CI 测试报告"
            echo
            echo "- 触发: ${{ github.event_name }}"
            echo "- 分支/引用: ${{ github.ref_name }}"
            echo "- 提交: ${{ github.sha }}"
            echo "- 时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## 各阶段结果索引"
            echo
            echo "| 阶段 | 状态 |"
            echo "|------|------|"
            echo "| 静态检查 (static) | ${{ needs.static.result }} |"
            echo "| 容器静态检查 (static-container) | ${{ needs.static-container.result }} |"
            echo "| 路由测试 (routing) | ${{ needs.routing.result }} |"
            echo "| 容器包解析 (install-container) | ${{ needs.install-container.result }} |"
            echo "| 国产化平台验证 (install-container-domestic) | ${{ needs.install-container-domestic.result }} |"
            echo "| VM 实装 (install-vm) | ${{ needs.install-vm.result }} |"
            echo
            echo "---"
            echo
          } > ci-report.md

          # 按目录顺序追加各报告
          for d in reports/*/; do
            name=$(basename "$d")
            {
              echo "## 产物集: $name"
              echo
              for f in "$d"*.md; do
                [ -f "$f" ] || continue
                echo "### $(basename "$f")"
                echo
                cat "$f"
                echo
              done
            } >> ci-report.md
          done

          # 写入步骤摘要（commit/PR 上直接可见）
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传汇总报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report.md
          if-no-files-found: error

      - name: 整体结果判定
        if: always()
        shell: bash
        run: |
          # 质量门禁：静态检查 (VM + 容器) + 路由测试 + 容器包解析 必须全部通过。
          # 实装测试 (install-vm) 依赖外网下载与真实 systemd，属“尽力而为”，
          # 其失败会记录在报告里但不阻塞整体（避免环境性误报让 CI 永远飘红）。
          for r in "${{ needs.static.result }}" "${{ needs.static-container.result }}" "${{ needs.routing.result }}" "${{ needs.install-container.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "核心阶段结果: $r —— 整体判定为失败"
              exit 1
            fi
          done
          if [ "${{ needs.install-vm.result }}" != "success" ] && [ "${{ needs.install-vm.result }}" != "skipped" ]; then
            echo "::warning::实装测试 (install-vm) 结果为 ${{ needs.install-vm.result }}，详见报告（受外网/环境限制，不阻塞整体）"
          fi
          if [ "${{ needs.install-container-domestic.result }}" != "success" ] && [ "${{ needs.install-container-domestic.result }}" != "skipped" ]; then
            echo "::warning::国产化平台验证 (install-container-domestic) 结果为 ${{ needs.install-container-domestic.result }}，详见报告（社区镜像/国产源网络不受控，不阻塞整体）"
          fi
          echo "所有核心阶段通过"

  # ============================================================
  # Job 6: 支持矩阵刷新 —— main 上将最近 CI 结论回写 README 表格
  #   解析 ci.yml 矩阵 + GitHub API job 结论，渲染进 README 标记区间；
  #   提交信息带 [skip ci] 防止循环触发。
  # ============================================================
  support-matrix:
    name: 支持矩阵刷新 / README
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 渲染并回写支持矩阵（无变化则跳过提交）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/support_matrix.sh update README.md
          if git diff --quiet README.md; then
            echo "表格无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: 刷新支持矩阵（[skip ci]）"
            git push
          fi
